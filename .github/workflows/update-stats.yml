name: Update GitHub Stats

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics (Stats + Languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_1 }}
          user: mdtrong1305

          # Layout
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Ho_Chi_Minh

          # Top Languages plugin
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage

          # Output
          filename: assets/stats.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update GitHub stats"
